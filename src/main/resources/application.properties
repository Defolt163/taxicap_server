spring.application.name=demo2
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Route price
spring.meterPrice = 0.045
spring.deliveryPrice = 45

# Server
server.port=8080

# Next.js push gateway
push.notify-url=${PUSH_NOTIFY_URL:http://localhost:3000/api/push/notify}
push.internal-secret=${PUSH_INTERNAL_SECRET:taxicap-local-push-9f4a7c2e6d1b8a0f}


# Square Geocoding , ,
spring.geoborder=51.438817,54.441303,51.511433,54.422359

spring.datasource.url=jdbc:mysql://localhost:3306/taxicap
spring.datasource.username=root
spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Email (для отправки кодов)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Settings
jwt.
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Verification Code
verification.code-expiration=300000
verification.code-length=4

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#logging.level.org.springframework.web.socket=TRACE
#logging.level.org.springframework.messaging=TRACE
#logging.level.org.springframework.web=DEBUG