spring.datasource.url=jdbc:mysql://${DB_HOST:db}:3306/${DB_NAME:taxicap_actual}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USER:taxicap_app}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_URL:redis}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET_KEY}
push.notify-url=${PUSH_NOTIFY_URL:http://web:3000/api/push/notify}
push.internal-secret=${PUSH_INTERNAL_SECRET}

services.tiles.url=${TILE_SERVER_URL:http://host.docker.internal:8001}
services.nominatim.url=${NOMINATIM_SERVER_URL:http://host.docker.internal:8003}
services.valhalla.url=${VALHALLA_SERVER_URL:http://host.docker.internal:8002}
